name: Docs

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version-file: pyproject.toml

      - name: Cache Pooch data
        uses: actions/cache@v5
        with:
          path: |
            ~/.cache/extracts
            ~/Library/Caches/extracts
            ~\AppData\Local\extracts
          key: pooch-${{ runner.os }}-${{ hashFiles('src/extracts/_fetchers.py') }}
          restore-keys: |
            pooch-${{ runner.os }}-

      - name: Cache jupyter-cache
        uses: actions/cache@v5
        with:
          path: docs/.jupyter_cache
          key: jupyter-cache-${{ runner.os }}-${{ hashFiles('docs/**/*.md', 'src/extracts/_fetchers.py') }}
          restore-keys: |
            jupyter-cache-${{ runner.os }}-

      - name: Install dependencies
        run: pip install .[dev]

      - name: Build docs
        run: sphinx-build -W -b html docs/ docs/_build/html

      - name: Upload artifact
        if: github.event_name == 'push'
        uses: actions/upload-pages-artifact@v4
        with:
          path: docs/_build/html

  deploy:
    if: github.event_name == 'push'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
